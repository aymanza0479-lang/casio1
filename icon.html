<!DOCTYPE html>
<html lang="ar">
<head>
    <meta charset="UTF-8">
    <title>Icon Generator</title>
    <style>
        body {
            margin: 0;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            background: #111;
        }
        .icon-box {
            width: 512px;
            height: 512px;
            background: linear-gradient(135deg, #2c3e50, #000000);
            border-radius: 110px;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            color: #fff;
            font-family: Arial, sans-serif;
            box-shadow: 0 10px 30px rgba(0,0,0,0.5);
            border: 8px solid #34495e;
        }
        .calc-screen {
            width: 360px;
            height: 110px;
            background: #9ead8f;
            border-radius: 12px;
            margin-bottom: 40px;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 15px;
            font-size: 45px;
            color: #111;
            font-weight: bold;
            letter-spacing: 2px;
            margin-top: 15px;
        
        }
        .brand {
            font-size: 32px;
            font-weight: bold;
            color: #ecf0f1;
            letter-spacing: 3px;
        }
    </style>
</head>
<body>

    <div class="icon-box" id="icon">
        <div class="calc-screen">CASIO</div>
        <div class="brand">fx-991ES</div>
    </div>

</div>

</body>
</html>
